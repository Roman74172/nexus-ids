[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ids"
version = "1.0.2"
description = "NEXUS IDS — Network Threat Detection & Analysis System"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["sentinel", "tools", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/test_cli.py" = ["E501"]  # golden output lines

[tool.setuptools.package-data]
sentinel = ["web_static/*.html"]
